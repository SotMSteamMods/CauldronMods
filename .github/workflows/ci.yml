name: Build and Test
on:
  push:
    branches: [ "ci" ]
env:
  ENGINE_DEPS_PATH: ${{ github.workspace }}/ci_deps/libs
  DEPLOY_PATH: ${{ github.workspace }}/deployed

jobs:
  build:
     runs-on: windows-2025-vs2026
     steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
      - name: Set Up Dependencies'
        uses: ./.github/actions/setup-depedencies-action
        with:
          checkout_path: 'ci_deps'
