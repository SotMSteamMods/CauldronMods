name: Build, Test, and Deploy
on:
  push:
    branches: [ "ci" ]
env:
  DEPENDENCIES_REPO: sentinels-dependencies
  DEPLOY_PATH: ${{ github.workspace }}/deploy/CauldronMods
  ENGINE_DEPS_PATH: ${{ github.workspace }}/ci_deps/libs
  ORGANIZATION_NAME: ${{ github.repository_owner }}
  CAULDRON_MODS_BUILD_FOLDER: CauldronMods/bin/Release/net48
jobs:
  build:
     runs-on: windows-2025-vs2026
     steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
      - name: Set Up Dependencies'
        uses: ./.github/actions/setup-depedencies-action
        with:
          checkout_path: 'ci_deps'
          dependency_app_id: ${{ secrets.DEP_FETCHER_APP_ID }}
          dependency_private_key: ${{ secrets.DEP_FETCHER_APP_PRIVATE_KEY }}
          dependency_repo_name: ${{ env.DEPENDENCIES_REPO }}
          dependency_repo_organization_name: ${{ env.ORGANIZATION_NAME }}
      - name: Create deployment folder
        run: mkdir -p ${{ env.DEPLOY_PATH }}
      - name: Build the CauldronMods project
        run:  dotnet build CauldronMods/CauldronMods.csproj --configuration Release
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cauldron-mods-build-artifacts
          path: ${{ env.CAULDRON_MODS_BUILD_FOLDER }}
      - name: Upload Deployment Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cauldron-mods-deployment-artifacts
          path: ${{ env.DEPLOY_PATH }}
          if-no-files-found: error
  test:
     runs-on: windows-2025-vs2026
     needs: build
     env:
      PYTHONIOENCODING: 'utf-8'
     steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Dependencies'
        uses: ./.github/actions/setup-depedencies-action
        with:
          checkout_path: 'ci_deps'
          dependency_app_id: ${{ secrets.DEP_FETCHER_APP_ID }}
          dependency_private_key: ${{ secrets.DEP_FETCHER_APP_PRIVATE_KEY }}
          dependency_repo_name: ${{ env.DEPENDENCIES_REPO }}
          dependency_repo_organization_name: ${{ env.ORGANIZATION_NAME }}
      - name: Download CauldronMod Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: cauldron-mods-build-artifacts
          path: ${{ env.CAULDRON_MODS_BUILD_FOLDER }}
      - name: Build the CauldronMods Test Project
        run: dotnet build Testing/Testing.csproj --configuration Release --no-dependencies
      - parallel:
        - name: Run CauldronMods Code Tests
          continue-on-error: true
          run: dotnet test --filter "FullyQualifiedName!~CauldronTests.Art&FullyQualifiedName!~CauldronTests.Oblivaeon&FullyQualifiedName!~CauldronTests.PromoUnlock&FullyQualifiedName!~CauldronTests.Random" --no-build --configuration Release --logger:"console;verbosity=normal;Synchronous=true" --logger "nunit;LogFilePath=test-results/CauldronTests.TestResults.xml" --blame-hang-timeout 20000 -- NUnit.ConsoleOut=0
        - name: Run CauldronMods Art Tests
          continue-on-error: true
          run: dotnet test --filter FullyQualifiedName~CauldronTests.Art --no-build --configuration Release --logger:"console;verbosity=normal;Synchronous=true" --logger "nunit;LogFilePath=test-results/CauldronTests.Art.TestResults.xml" --blame-hang-timeout 20000 -- NUnit.ConsoleOut=0
        - name: Run CauldronMods Oblivaeon Tests
          continue-on-error: true
          run: dotnet test --filter FullyQualifiedName~CauldronTests.Oblivaeon --no-build --configuration Release --logger:"console;verbosity=normal;Synchronous=true" --logger "nunit;LogFilePath=test-results/CauldronTests.Oblivaeon.TestResults.xml" --blame-hang-timeout 20000 -- NUnit.ConsoleOut=0
        - name: Run CauldronMods Promo Unlock Tests
          continue-on-error: true
          run: dotnet test --filter FullyQualifiedName~CauldronTests.PromoUnlock --no-build --configuration Release --logger:"console;verbosity=normal;Synchronous=true" --logger "nunit;LogFilePath=test-results/CauldronTests.PromoUnlock.TestResults.xml" --blame-hang-timeout 20000 -- NUnit.ConsoleOut=0
        - name: Run CauldronMods Random Tests
          continue-on-error: true
          run: dotnet test --filter FullyQualifiedName~CauldronTests.Random --no-build --configuration Release --logger:"console;verbosity=normal;Synchronous=true" --logger "nunit;LogFilePath=test-results/CauldronTests.Random.TestResults.xml" --blame-hang-timeout 20000 -- NUnit.ConsoleOut=0
      - name: Upload Test Reports
        id: parse-tests
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: CauldronMod Tests 
          path: Testing/test-results/*.xml
          reporter: dotnet-nunit
          # @TODO: Once tests are stable, we can remove this so the expectation is success on tests?
          fail-on-error: false
      - name: Generate Passed Badge
        uses: tagdots/setup-badge-action@663d7a5382b8300caa4492de16e85aa7e4667ef0
        if: ${{ !cancelled() && steps.parse-tests.outputs.passed > 0 }}
        with:
          badge-name: tests-passed
          label: passed
          message: ${{ steps.parse-tests.outputs.passed }}
          message-color: brightgreen
          badge-style: flat
          gitconfig-name: github-actions-bot
          gitconfig-email: 41898282+github-actions-bot@users.noreply.github.com
      - name: Generate Failed Badge
        uses: tagdots/setup-badge-action@663d7a5382b8300caa4492de16e85aa7e4667ef0
        if: ${{ !cancelled()  && steps.parse-tests.outputs.failed > 0 }}
        with:
          badge-name: tests-failed
          label: failed
          message: ${{ steps.parse-tests.outputs.failed }}
          message-color: red
          gitconfig-name: github-actions-bot
          gitconfig-email: 41898282+github-actions-bot@users.noreply.github.com
      - name: Generate Skipped Badge
        uses: tagdots/setup-badge-action@663d7a5382b8300caa4492de16e85aa7e4667ef0
        if: ${{ !cancelled() && steps.parse-tests.outputs.skipped > 0 }}
        with:
          badge-name: tests-skipped
          label: skipped
          message: ${{ steps.parse-tests.outputs.skipped }}
          message-color: blue
          gitconfig-name: github-actions-bot
          gitconfig-email: 41898282+github-actions-bot@users.noreply.github.com
  deployment:
     runs-on: windows-2025-vs2026
     needs: build
     steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
      - name: Download CauldronMod Deployment Artifacts
        uses: actions/download-artifact@v4
        with:
          name: cauldron-mods-deployment-artifacts
          path: ${{ env.DEPLOY_PATH }}
      - name: Move other deployed assets into the deployment path
        run: |
          cp -R ./DeckBrowser ${{ env.DEPLOY_PATH }}/DeckBrowser
          cp -R ./Fonts ${{ env.DEPLOY_PATH }}/Fonts
          cp ./preview.jpg ${{ env.DEPLOY_PATH }}/preview.jpg
      - name: Extract Version from manifest.json
        run: |
          $manifest = Get-Content CauldronMods/manifest.json -Raw | ConvertFrom-Json
          Add-Content -Path $env:GITHUB_ENV -Value "DEPLOY_VERSION=$($manifest.version)"
      - name: Archive Deployment
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: 'Cauldron_${{ env.DEPLOY_VERSION }}.zip'
          directory: ${{ env.DEPLOY_PATH }}
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.DEPLOY_PATH }}/Cauldron_${{ env.DEPLOY_VERSION }}.zip
          archive: false
          if-no-files-found: error
        
