name: 'Set Up Dependencies'
description: 'Sets up dependencies for Sentinels Steam Mods'
inputs:
  checkout_path:
    description: 'Where to check out dependency'
    required: true
    default: 'deps'
env:
  DEPENDENCIES_REPO: sentinels-dependencies
  ORGANIZATION_NAME: ${{ github.repository_owner }}
runs:
  using: "composite"
  steps:
    - name: Generate GitHub App Token
      uses: actions/create-github-app-token@v1
      id: app-token
      with:
        app-id: ${{ secrets.DEP_FETCHER_APP_ID }}
        private-key: ${{ secrets.DEP_FETCHER_APP_PRIVATE_KEY }}
        owner: ${{ env.ORGANIZATION_NAME }}
        repositories: ${{ env.DEPENDENCIES_REPO }}
    - name: Checkout Depedencies
      uses: actions/checkout@v7
      with:
        repository: '${{ env.ORGANIZATION_NAME }}/${{ env.DEPENDENCIES_REPO }}'
        token: ${{ steps.app-token.outputs.token }}
        path: ${{ inputs.checkout_path }}
